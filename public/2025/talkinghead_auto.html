<html>
<head>
  <title>test_threejs demos</title>
  <style>
    body {
      background: #efefef;
    }
    #rotatingC {
      position: relative;
    }
    .camera-axis-helper {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(2px);
      user-select: none;
      z-index: 5;
    }
    .camera-axis-helper svg {
      width: 100%;
      height: 100%;
    }
    .camera-axis-line {
      stroke-width: 6;
      cursor: grab;
      stroke-linecap: round;
      opacity: 0.9;
      transition: opacity 0.12s linear;
    }
    .camera-axis-line:hover {
      opacity: 1;
    }
    .camera-axis-line.dragging {
      cursor: grabbing;
      opacity: 1;
    }
    .camera-axis-label {
      fill: #fff;
      font-size: 13px;
      font-family: sans-serif;
      pointer-events: none;
    }
  </style>

  <!-- Import maps polyfill -->
  <!-- Remove this when import maps will be widely supported -->
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/vendor/javascript/CCapture.all.min.js"></script>

  <script type="importmap">
    { "imports":
      {
        "three": "/vendor/javascript/threejs/three.module.js",
        "three/addons/": "/vendor/javascript/threejs/jsm/",
        "talkinghead": "/vendor/javascript/talkinghead.js"
      }
    }
  </script>


</head>
<body>
  <h1 class='center text-center'>{{ label }}</h1>
  <button id='speak'>Speak</button>
  <div id='avatar'></div>
  <div id='loading'>Loading...</div>
  <div id="rotatingC" class="r2" style="width: 640px;
    height: 480px;
    border: 1px solid red;
    text-align: center; " >
    <div id="cameraAxisHelper" class="camera-axis-helper" aria-label="Camera axis helper">
      <svg viewBox="0 0 120 120">
        <line id="axisX" class="camera-axis-line" x1="60" y1="60" x2="106" y2="60" stroke="#ff4d4d"></line>
        <line id="axisY" class="camera-axis-line" x1="60" y1="60" x2="60" y2="14" stroke="#4dff88"></line>
        <line id="axisZ" class="camera-axis-line" x1="60" y1="60" x2="26" y2="94" stroke="#4da6ff"></line>
        <text class="camera-axis-label" x="109" y="64">X</text>
        <text class="camera-axis-label" x="62" y="13">Y</text>
        <text class="camera-axis-label" x="15" y="102">Z</text>
        <circle cx="60" cy="60" r="4" fill="#ffffff"></circle>
      </svg>
    </div>
  </div>

  <script type="module">
    const logg = (a, b="", c=null) => {
      if ('undefined' === typeof window) { return }

      c = "string" === typeof c ? c : b.replace(/\W/g, "");
      if (c.length > 0) {
        window[c] = a;
      }
      console.log(`+++ ${b}:`, a); // eslint-disable-line no-console
    };

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    import { TalkingHead } from "talkinghead";

    const params = new URLSearchParams(window.location.search);

    const w = 1024;
    const h = 576;
    let config = {
        sampleRate: 8000,
        mood: 'neutral',
        gain: 0.5,
        lipsyncType: "visemes",
        lipsyncLang: "en",
        waitForAudioChunks: false,
        enableMetrics: false,
      };
    const FPS = 24;
    let frame = 0;
    const api_key = params.get('api_key')
    const api_secret = params.get('api_secret')
    const wco_origin = params.get('wco_origin')
    const newspartial_id = params.get('newspartial_id')
    let totalFrames

    let camera, controls, head, renderer, scene;
    var capturer = new CCapture( { format: 'webm', framerate: FPS } );
    let activeAxisDrag = null;

    async function init() {
      const url = wco_origin + '/wco/api/newspartials/' + newspartial_id + '/config.json?api_key=' + api_key + '&api_secret=' + api_secret
      let chunkedInput = await fetch(url).then(r => r.json())
      logg(chunkedInput, 'chunkedInput')
      const last = chunkedInput.wtimes.length-1
      const duration_ms = chunkedInput.wtimes[last] + chunkedInput.wdurations[last]
      logg(duration_ms, 'duration_ms')
      totalFrames = duration_ms/1000*FPS;


      // const container = document.createElement( 'div' )
      const loader = new GLTFLoader().setPath( '/vendor/models' )
      scene = new THREE.Scene();

      /* fov — Camera frustum vertical field of view.
       * aspect — Camera frustum aspect ratio.
       * near — Camera frustum near plane.
       * far — Camera frustum far plane.
      **/
      camera = new THREE.PerspectiveCamera( 10, w/h, 0.1, 10 )
      camera.position.set( 1.86, 1.44, 1.00 )
      camera.rotation.set( -.06, 0.73, 0.04 )

      const ambientLight = new THREE.AmbientLight( 0xffffff );
      scene.add( ambientLight );

      // const pointLight = new THREE.PointLight( 0xffffff, 15 );
      // camera.add( pointLight );
      // scene.add( camera );



      // loader.load( '/cyberpunk-laptop/cyberpunk-laptop.glb', function ( gltf ) {
      //   $("#rotatingC span.label").css('display', 'none')
      //   document.getElementById('rotatingC').appendChild( container )
      //   scene.add( gltf.scene )
      // } );

      const nodeAvatar = document.getElementById('avatar');
      head = new TalkingHead( nodeAvatar, {
        avatarOnly: true,
        avatarOnlyCamera: camera,

        lipsyncModules: ["en"],
        // cameraView: "upper",
        // update: function () {
        //   capturer.capture( renderer.domElement );
        // }
      });
      // logg(head, 'head')



      const nodeLoading = document.getElementById('loading');
      try {
        nodeLoading.textContent = "Loading...";
        await head.showAvatar( {
          // url: 'https://models.readyplayer.me/64bfa15f0e72c63d7c3934a6.glb?morphTargets=ARKit,Oculus+Visemes,mouthOpen,mouthSmile,eyesClosed,eyesLookUp,eyesLookDown&textureSizeLimit=1024&textureFormat=png',
          url: '/vendor/models/2026/zhenja/model.glb',
          body: 'F',
          avatarMood: 'neutral',
          lipsyncLang: 'en'
        }, (ev) => {
          if ( ev.lengthComputable ) {
            let val = Math.min(100,Math.round(ev.loaded/ev.total * 100 ));
            nodeLoading.textContent = "Loading " + val + "%";
          }
        });
        nodeLoading.style.display = 'none';

        head.armature.position.set(0,-3,0);
        head.armature.rotation.set(0,1,0);
        scene.add(head.armature);

        await head.streamStart({
              sampleRate: config.sampleRate,
              mood: config.mood,
              gain: config.gain,
              lipsyncType: config.lipsyncType,
              lipsyncLang: config.lipsyncLang,
              waitForAudioChunks: config.waitForAudioChunks,
              // Configure metrics: enabled/disabled and reporting rate
              metrics: config.enableMetrics ? { enabled: true, intervalHz: config.metricsInterval } : { enabled: false }
            })

        capturer.start();
        logg('capturer.start')
        head.streamAudio(chunkedInput);

      } catch (error) {
        console.log(error);
        nodeLoading.textContent = error.toString();
      }


      //

      renderer = new THREE.WebGLRenderer( {
        alpha: false,
        antialias: true,
      } );
      renderer.setPixelRatio( window.devicePixelRatio );
      renderer.setSize( w, h );
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.getElementById('rotatingC').appendChild( renderer.domElement );

      //

      controls = new OrbitControls( camera, renderer.domElement );
      controls.enableDamping = true;
      controls.minDistance = 0.5;
      controls.maxDistance = 100;
      controls.autoRotate = false;
      controls.update();
      initCameraAxisHelper();

      //

      window.addEventListener( 'resize', onWindowResize );


      // renderer.setAnimationLoop(animate);
      animate()
    }

    let semafore = false
    document.addEventListener('DOMContentLoaded', async function(e) {
      if (!semafore) {
        semafore = true
        await init()
      }
    })

    function onWindowResize() {
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize( w, h );
      render();
    }

    function render() {
      renderer.render( scene, camera );
    }

    function initCameraAxisHelper() {
      const helperNode = document.getElementById('cameraAxisHelper');
      if (!helperNode) return;

      const axisMap = {
        axisX: 'x',
        axisY: 'y',
        axisZ: 'z',
      };

      const onPointerMove = (event) => {
        if (!activeAxisDrag) return;
        event.preventDefault();

        const deltaX = event.clientX - activeAxisDrag.startX;
        const deltaY = event.clientY - activeAxisDrag.startY;
        const dragAmount = deltaX - deltaY;
        const movementScale = 0.003;
        const axisMovement = dragAmount * movementScale;

        camera.position[activeAxisDrag.axis] = activeAxisDrag.startValue + axisMovement;
        controls.update();
      };

      const onPointerUp = () => {
        if (!activeAxisDrag) return;
        activeAxisDrag.element.classList.remove('dragging');
        activeAxisDrag = null;
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
      };

      Object.entries(axisMap).forEach(([id, axis]) => {
        const element = document.getElementById(id);
        if (!element) return;

        element.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          event.stopPropagation();
          activeAxisDrag = {
            axis,
            startX: event.clientX,
            startY: event.clientY,
            startValue: camera.position[axis],
            element,
          };
          element.classList.add('dragging');
          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
        });
      });
    }

    function animate() {
      const t = frame / FPS;
      head.animate(1000/FPS);
      controls.update();
      renderer.render( scene, camera );
      capturer.capture( renderer.domElement );

      frame++;
      if (frame < totalFrames) {
        requestAnimationFrame(animate)
      } else {
        capturer.stop();
        logg('capturer.stop')
        capturer.save((blob) => {
          logg(blob, 'blob')
          renderer.domElement.toBlob((thumb) => {
            logg(thumb, 'thumb')

            const form = new FormData();
            form.append('video', blob, 'lips.webm')
            form.append('name', '<ccapturejs>')
            form.append('thumb', thumb)
            form.append('newspartial_id', newspartial_id)

            fetch(wco_origin + '/wco/api/videos/?api_key=' + api_key + '&api_secret=' + api_secret, {
              method: 'POST',
              headers: {
                // 'Content-Type': 'video/webm',
              },
              body: form,
            })

          })
        });
      }
    }


    // Speak when clicked
    const nodeSpeak = document.getElementById('speak');
      nodeSpeak.addEventListener('click', function () {
        try {

        } catch (error) {
          console.log(error);
        }
      });


  </script>

</body>
</html>
