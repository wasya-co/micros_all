  <!-- <h1>Hello</h1> -->

  <button onclick="speak()">Speak</button>
  <button id="start">Record</button>
  <br />
  <audio controls id='speech'>
    <source src="speech.wav" type="audio/wav">
    Your browser does not support the audio element.
  </audio>
  <br />
  <canvas id="canvas" width="854" height="460"></canvas>

<script>
/* logg
**/
const logg = (a, b="", c=null) => {
  if ('undefined' === typeof window) { return }

  c = "string" === typeof c ? c : b.replace(/\W/g, "");
  if (c.length > 0) {
    window[c] = a;
  }
  console.log(`+++ ${b}:`, a); // eslint-disable-line no-console
};

function loadVoices() {
  return new Promise(resolve => {
    const voices = speechSynthesis.getVoices()

    if (voices.length > 0) {
      resolve(voices)
      return
    }

    speechSynthesis.addEventListener('voiceschanged', () => {
      resolve(speechSynthesis.getVoices())
    }, { once: true })
  })
}

async function speak() {
  const text = "The yankee military has effectively run out of high precision, land based tactical missiles due to its campaign against Iran."
  const utterance = new SpeechSynthesisUtterance(text)




  let voices = await loadVoices()
  voices = voices.filter(voice =>
    voice.lang.startsWith('en')
  )
  // logg(voices.map(v => v.name), 'voices')
  const voice = voices[0] // .find(v => v.name === 'Cellos')

  utterance.rate = 1
  utterance.pitch = 1
  utterance.volume = 1
  utterance.voice = voice
  speechSynthesis.speak(utterance)

  // voices.map(async (voice) => {
  //   utterance.voice = voice

  //   await speechSynthesis.speak(utterance)
  //   logg(voice, 'voice')
  // })

}

  const canvas = document.getElementById('canvas')
  const ctx = canvas.getContext('2d')
  const fps = 30
  const duration = 3
  const totalFrames = fps * duration

  let capturer = null
  let frame = 0
  let animating = false

  /*
   * green to yellow
  **/
  let direction = 1
  const speed = 0.01
  let progress = 0

  function draw() {
    progress += speed * direction

    if (progress >= 1 || progress <= 0) {
      direction *= -1
      progress = Math.max(0, Math.min(1, progress))
    }

    const red = Math.round(255 * progress)
    ctx.fillStyle = `rgb(${red}, 255, 0)`
    ctx.fillRect(0, 0, canvas.width, canvas.height)
  }

  function animate() {
    draw()
    capturer.capture(canvas)
    frame++
    // logg(frame, 'frame')

    if (frame < totalFrames) {
      // Native timer (saved before capturer.start) so playback is visible at fps
      window._timeoutNative(animate, 1000 / fps)
    } else {
      animating = false
      capturer.stop()
      capturer.save()
    }
  }

  const speech = document.getElementById('speech')

  const doCapture = () => {
    if (animating) return
    animating = true

    frame = 0
    progress = 0
    direction = 1

    // Save real timers before CCapture hooks them
    window._rafNative = window.requestAnimationFrame.bind(window)
    window._timeoutNative = window.setTimeout.bind(window)


    capturer = new CCapture({
      format: 'webm',
      framerate: fps,
      media: speech,
    })
    capturer.start()

    // Restore native timers so the canvas animates in real time
    window.requestAnimationFrame = window._rafNative
    window.setTimeout = window._timeoutNative

    animate()
  }

  // initial frame so the canvas isn't blank
  ctx.fillStyle = 'rgb(0, 255, 0)'
  ctx.fillRect(0, 0, canvas.width, canvas.height)

  document.getElementById('start').addEventListener('click', doCapture)
</script>
