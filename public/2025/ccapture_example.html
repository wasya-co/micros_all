<body>
  <h1>Hello</h1>

  <button onclick="speak()">Speak</button>
  <button id="start">Record</button>
  <br />

<script>
/* logg
**/
const logg = (a, b="", c=null) => {
  if ('undefined' === typeof window) { return }

  c = "string" === typeof c ? c : b.replace(/\W/g, "");
  if (c.length > 0) {
    window[c] = a;
  }
  console.log(`+++ ${b}:`, a); // eslint-disable-line no-console
};

function loadVoices() {
  return new Promise(resolve => {
    const voices = speechSynthesis.getVoices()

    if (voices.length > 0) {
      resolve(voices)
      return
    }

    speechSynthesis.addEventListener('voiceschanged', () => {
      resolve(speechSynthesis.getVoices())
    }, { once: true })
  })
}

async function speak() {
  const text = "Hello, this is text to speech in HTML."
  const utterance = new SpeechSynthesisUtterance(text)




  let voices = await loadVoices()
  voices = voices.filter(voice =>
    voice.lang.startsWith('en')
  )
  // logg(voices.map(v => v.name), 'voices')
  const voice = voices[0] // .find(v => v.name === 'Cellos')

  utterance.rate = 1
  utterance.pitch = 1
  utterance.volume = 1
  utterance.voice = voice
  speechSynthesis.speak(utterance)

  // voices.map(async (voice) => {
  //   utterance.voice = voice

  //   await speechSynthesis.speak(utterance)
  //   logg(voice, 'voice')
  // })

}
</script>
<canvas id="canvas" width="854" height="460"></canvas>
<script>
  const canvas = document.getElementById('canvas')
  const ctx = canvas.getContext('2d')
  const fps = 30
  const duration = 3
  const totalFrames = fps * duration





  let capturer = new CCapture({
    format: 'webm',
    framerate: fps,
  })
  let frame = 0

  /*
   * green to yellow
  **/
  let direction = 1
  const speed = 0.01
  let progress = 0
  function animate() {
    progress += speed * direction

    if (progress >= 1 || progress <= 0) {
      direction *= -1
    }

    const red = Math.round(255 * progress)
    const green = 255
    const blue = 0

    ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`
    ctx.fillRect(0, 0, canvas.width, canvas.height)

    capturer.capture(canvas)
    frame++

    logg(frame, 'frame')

    if (frame < totalFrames) {
      requestAnimationFrame(animate)
    } else {
      capturer.stop()
      capturer.save()
    }
  }

  const doCapture = () => {
    capturer.start()
    animate()
  }

  document.getElementById('start').addEventListener('click', doCapture)


</script>
