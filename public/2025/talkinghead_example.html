<html>
<head>
  <title>test_threejs demos</title>
  <style>
    body {
      background: #efefef;
    }
    .camera-helper {
      position: fixed;
      right: 16px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      z-index: 9999;
    }
    .camera-helper button {
      min-width: 52px;
      padding: 6px 8px;
      border: 1px solid #666;
      border-radius: 4px;
      background: #fff;
      color: #111;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
    }
  </style>

  <!-- Import maps polyfill -->
  <!-- Remove this when import maps will be widely supported -->
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="/vendor/javascript/CCapture.all.min.js"></script>

  <script type="importmap">
    { "imports":
      {
        "three": "/vendor/javascript/threejs/three.module.js",
        "three/addons/": "/vendor/javascript/threejs/jsm/",
        "talkinghead": "/vendor/javascript/talkinghead.js"
      }
    }
  </script>


</head>
<body>
  <h1 class='center text-center'>{{ label }}</h1>
  <button id='speak'>Speak</button>
  <div id='avatar'></div>
  <div id='loading'>Loading...</div>
  <div class="camera-helper">
    <button data-axis="y" data-delta="10">+y</button>
    <button data-axis="y" data-delta="-10">-y</button>
    <button data-axis="x" data-delta="10">+x</button>
    <button data-axis="x" data-delta="-10">-x</button>
    <button data-axis="z" data-delta="10">+z</button>
    <button data-axis="z" data-delta="-10">-z</button>
  </div>
  <div id="rotatingC" class="r2" style="width: 640px;
    height: 480px;
    border: 1px solid red;
    text-align: center; " >
  </div>

  <script type="module">
    const logg = (a, b="", c=null) => {
      if ('undefined' === typeof window) { return }

      c = "string" === typeof c ? c : b.replace(/\W/g, "");
      if (c.length > 0) {
        window[c] = a;
      }
      console.log(`+++ ${b}:`, a); // eslint-disable-line no-console
    };

    import * as THREE from 'three';

    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    import { TalkingHead } from "talkinghead";

    const params = new URLSearchParams(window.location.search);

    const w = 1024;
    const h = 576;
    let config = {
        sampleRate: 8000,
        mood: 'neutral',
        gain: 0.5,
        lipsyncType: "visemes",
        lipsyncLang: "en",
        waitForAudioChunks: false,
        enableMetrics: false,
      };
    const FPS = 24;
    let frame = 0;
    const api_key = params.get('api_key')
    const api_secret = params.get('api_secret')
    const wco_origin = params.get('wco_origin')
    const newspartial_id = params.get('newspartial_id')
    let totalFrames = Number.POSITIVE_INFINITY

    let camera, capturing, controls, head, renderer, scene;
    var capturer = new CCapture( { format: 'webm', framerate: FPS } );
    const CAMERA_STEP = 0.05;

    function setupCameraHelper() {
      const helperButtons = document.querySelectorAll('.camera-helper button');
      helperButtons.forEach((button) => {
        button.addEventListener('click', () => {
          const axis = button.dataset.axis;
          const direction = Number(button.dataset.delta);
          camera.position[axis] += direction * CAMERA_STEP;
          controls.update();
        });
      });
    }


    async function init() {
      // const container = document.createElement( 'div' )
      const loader = new GLTFLoader().setPath( '/vendor/models' )
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd3d3d3); // light gray


      /* fov — Camera frustum vertical field of view.
       * aspect — Camera frustum aspect ratio.
       * near — Camera frustum near plane.
       * far — Camera frustum far plane.
      **/
      camera = new THREE.PerspectiveCamera( 10, w/h, 0.001, 1000 )
      camera.position.set( 1.86, 1.44, 1.00 )
      camera.rotation.set( -.06, 0.73, 0.04 )

      const ambientLight = new THREE.AmbientLight( 0xffffff );
      scene.add( ambientLight );

      // const pointLight = new THREE.PointLight( 0xffffff, 15 );
      // camera.add( pointLight );
      // scene.add( camera );

      // loader.load( '/cyberpunk-laptop/cyberpunk-laptop.glb', function ( gltf ) {
      //   $("#rotatingC span.label").css('display', 'none')
      //   document.getElementById('rotatingC').appendChild( container )
      //   scene.add( gltf.scene )
      // } );

      const nodeAvatar = document.getElementById('avatar');
      head = new TalkingHead( nodeAvatar, {
        avatarOnly: true,
        avatarOnlyCamera: camera,

        lipsyncModules: ["en"],
        // cameraView: "upper",
        // update: function () {
        //   capturer.capture( renderer.domElement );
        // }
      });
      // logg(head, 'head')



      const nodeLoading = document.getElementById('loading');
      try {
        nodeLoading.textContent = "Loading...";
        await head.showAvatar( {
          url: '/vendor/models/2026/julia.glb',
          body: 'F',
          avatarMood: 'neutral',
          lipsyncLang: 'en'
        }, (ev) => {
          if ( ev.lengthComputable ) {
            let val = Math.min(100,Math.round(ev.loaded/ev.total * 100 ));
            nodeLoading.textContent = "Loading " + val + "%";
          }
        });
        nodeLoading.style.display = 'none';

        head.armature.position.set(0,-3,0);
        head.armature.rotation.set(0,1,0);
        scene.add(head.armature);

        await head.streamStart({
          sampleRate: config.sampleRate,
          mood: config.mood,
          gain: config.gain,
          lipsyncType: config.lipsyncType,
          lipsyncLang: config.lipsyncLang,
          waitForAudioChunks: config.waitForAudioChunks,
          // Configure metrics: enabled/disabled and reporting rate
          metrics: config.enableMetrics ? { enabled: true, intervalHz: config.metricsInterval } : { enabled: false }
        })


      } catch (error) {
        console.log(error);
        nodeLoading.textContent = error.toString();
      }


      //

      renderer = new THREE.WebGLRenderer( {
        alpha: false,
        antialias: true,
      } );
      renderer.setPixelRatio( window.devicePixelRatio );
      renderer.setSize( w, h );
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1;
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.getElementById('rotatingC').appendChild( renderer.domElement );

      //

      controls = new OrbitControls( camera, renderer.domElement );
      controls.enableDamping = true;
      controls.minDistance = 0.5;
      controls.maxDistance = 100;
      controls.autoRotate = false;
      controls.update();
      setupCameraHelper();

      //

      window.addEventListener( 'resize', onWindowResize );

      animate()
    }

    let semafore = false
    document.addEventListener('DOMContentLoaded', async function(e) {
      if (!semafore) {
        semafore = true
        await init()
      }
    })

    function onWindowResize() {
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize( w, h );
      render();
    }

    function render() {
      renderer.render( scene, camera );
    }

    function animate() {
      const t = frame / FPS;
      head.animate(1000/FPS);
      controls.update();
      renderer.render( scene, camera );

      if ('pending' == capturing) {
        capturer.capture( renderer.domElement );
        capturing = 'capturing'
      }

      frame++;
      if (frame < totalFrames) {
        requestAnimationFrame(animate)
      } else {
        if ('capturing' == capturing) {
          capturer.stop();
          logg('capturer.stop')
          capturer.save((blob) => {
            logg(blob, 'blob')
            renderer.domElement.toBlob((thumb) => {
              logg(thumb, 'thumb')

              const form = new FormData();
              form.append('video', blob, 'lips.webm')
              form.append('name', '<ccapturejs>')
              form.append('thumb', thumb)
              form.append('newspartial_id', newspartial_id)

              fetch(wco_origin + '/wco/api/videos/?api_key=' + api_key + '&api_secret=' + api_secret, {
                method: 'POST',
                headers: {
                  // 'Content-Type': 'video/webm',
                },
                body: form,
              })

              capturing = false
            })
          })
        }
      }
    }


    // Speak when clicked
    const nodeSpeak = document.getElementById('speak');
    nodeSpeak.addEventListener('click', async function () {
      try {

        const url = wco_origin + '/wco/api/newspartials/' + newspartial_id + '/config.json?api_key=' + api_key + '&api_secret=' + api_secret
        let chunkedInput = await fetch(url).then(r => r.json())
        const last = chunkedInput.wtimes.length - 1
        const duration_ms = chunkedInput.wtimes[last] + chunkedInput.wdurations[last]
        totalFrames = duration_ms / 1000 * FPS;
        frame = 0;
        capturing = 'pending';

        capturer.start();
        logg('capturer.start')
        head.streamAudio(chunkedInput);

      } catch (error) {
        console.log(error);
      }
    });


  </script>

</body>
</html>
