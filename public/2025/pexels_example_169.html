
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pexels Image Search (16:9)</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }

    form {
      margin-bottom: 20px;
    }

    input {
      padding: 8px;
      font-size: 16px;
    }

    button {
      padding: 8px 12px;
      font-size: 16px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .photo {
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
    }

    /* 16:9 container */
    .photo-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    /* Fallback for very old browsers */
    @supports not (aspect-ratio: 16 / 9) {
      .photo-frame {
        padding-top: 56.25%; /* 9 / 16 */
      }
    }

    .photo-frame img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* crop to fill */
      display: block;
    }

    .caption {
      padding: 6px;
      font-size: 14px;
      background: #f5f5f5;
    }
  </style>
</head>
<body>

  <h1>Pexels Image Search (16:9)</h1>

  <form id="search-form">
    <input type="text" id="query" placeholder="Search images..." required />
    <button type="submit">Search</button>
  </form>

  <div id="results" class="grid"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const API_KEY = params.get('PEXELS_API_KEY');

    const form = document.getElementById('search-form');
    const results = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = document.getElementById('query').value;
      results.innerHTML = 'Loading…';

      try {
        const response = await fetch(
          `https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=16`,
          { headers: { Authorization: API_KEY } }
        );

        const data = await response.json();
        renderPhotos(data.photos);
      } catch (err) {
        results.innerHTML = 'Error loading images.';
        console.error(err);
      }
    });

    function renderPhotos(photos) {
      results.innerHTML = '';

      if (!photos || photos.length === 0) {
        results.innerHTML = 'No results found.';
        return;
      }

      photos.forEach(photo => {
        const div = document.createElement('div');
        div.className = 'photo';

        // action="/wco/api/newsvideos/${params.get('newsvideo_id')}/generate-illustration"

        div.innerHTML = `

          <img class='photo-frame' src="${photo.src.landscape}" alt="${photo.alt || ''}">

          <form action="/wco/newsvideos/${params.get('newsvideo_id')}/generate-illustration"
                method="post"
                target="_blank"
                rel="noopener"
          ><input type="hidden" name="image_url" value="${photo.src.landscape}">
           <button type="submit" class="photo-frame-button">Generate Stable Diffusion Illustration</button>
          </form>

          <form action="/wco/newsvideos/${params.get('newsvideo_id')}/add-image-as-overlay"
                method="post"
                target="_blank"
                rel="noopener"
          ><input type="hidden" name="image_url" value="${photo.src.landscape}">
           <button type="submit" class="photo-frame-button">Add as 3-sec overlay</button>
          </form>
        `;

        results.appendChild(div);
      });
    }
  </script>

</body>
</html>
